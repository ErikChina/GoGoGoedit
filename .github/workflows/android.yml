name: Build GoGoGo APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-32" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342"

      - name: Fix Linux keystore paths
        run: |
          sed -i 's#..\\\\keystore\\\\GoGoGo.jks#../keystore/GoGoGo.jks#g' app/build.gradle || true
          sed -i "s#..\\\\keystore\\\\GoGoGo.jks#../keystore/GoGoGo.jks#g" app/build.gradle || true
          grep -n 'storeFile' app/build.gradle || true

      # 关键步骤：创建 local.properties
      - name: Create local.properties
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "----- local.properties content -----"
          cat local.properties
          ls -la local.properties

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build debug APK
        run
